name: Aggiorna Mappa Funghi Giornaliera

on:
  schedule:
    - cron: '0 3 * * *'  # Esegue ogni giorno alle 06:00 UTC
  workflow_dispatch:      # Permette di avviarlo manualmente quando vuoi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          sudo apt-get update && sudo apt-get install -y libspatialindex-dev
          pip install --upgrade pip
          pip install rasterio geopandas pymc arviz shapely scikit-learn requests

      - name: Esecuzione script predittivo
        run: python main.py

      - name: Pubblicazione automatica modifiche
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Aggiornamento automatico mappa [skip ci]" || echo "Nessuna modifica da committare"
          git push